<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your NorthCart password</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
        <td style="padding:32px;">
            <h1 style="margin:0 0 16px;font-size:22px;">NorthCart</h1>
            <p>Hi <span th:text="${name}">Customer</span>,</p>
            <p>We received a request to reset your password. Click the button below to choose a new one.</p>
            <p style="margin:28px 0;">
                <a th:href="${resetLink}" href="#"
                   style="background:#111827;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">
                    Reset password
                </a>
            </p>
            <p style="font-size:14px;color:#4b5563;">
                This link is valid for <span th:text="${validForMinutes}">15</span> minutes and can be used once.
            </p>
            <p style="font-size:14px;color:#4b5563;">
                If you didn't ask for this, you can ignore this email. Your password won't change.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
