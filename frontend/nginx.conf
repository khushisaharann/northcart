# nginx in front of the React app.
#   /api/...   -> reverse proxy to the Spring Boot container ("backend" on the Docker network)
#   /assets/.. -> hashed, immutable build files: cache for a year
#   anything else -> index.html, so React Router can handle deep links like /orders/NC-123

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;                      # don't advertise the nginx version

    # Compression for text assets (JSON from the API is already gzipped by Spring).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Basic hardening headers for the HTML app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API: same origin as the app, so the browser needs no CORS at all.
    location /api/ {
        # A variable + resolver makes nginx look "backend" up at request time, so nginx
        # still starts (and recovers) if the backend container is restarted or not up yet.
        resolver 127.0.0.11 valid=10s;      # Docker's embedded DNS
        set $backend http://backend:8080;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;            # the API only takes small JSON bodies
    }

    # ---- Vite output: file names contain a content hash, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback. index.html itself must never be cached, or users keep an old
    # version that points at deleted asset files after a deploy.
    # (nginx gotcha: any add_header inside a location DISCARDS the server-level ones,
    # so the security headers are repeated here.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
